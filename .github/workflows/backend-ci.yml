name: Backend CI Pipeline

on:
  push:
    branches: [ main ]
    paths:
      - 'application/backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'application/backend/**'

env:
  IMAGE_NAME: hamid009/mern-backend

jobs:
  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: application/backend
          args: >
            -Dsonar.projectKey=${{ secrets.SONAR_BACKEND_PROJECT_KEY }}
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}
            -Dsonar.projectName=mern-backend
            -Dsonar.sources=.
            -Dsonar.exclusions=node_modules/**

  owasp:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: mern-backend
          path: application/backend
          format: HTML
          args: >
            --enableRetired

      - name: Upload OWASP Report
        uses: actions/upload-artifact@v4
        with:
          name: owasp-backend-report
          path: reports/

  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: [sonarcloud, owasp]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: application/backend
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.run_number }}
            ${{ env.IMAGE_NAME }}:latest

  update-k8s-manifest:
    name: Update K8s Manifest
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GIT_TOKEN }}

      - name: Update backend image tag
        run: |
          sed -i "s|image: hamid009/mern-backend:.*|image: hamid009/mern-backend:${{ github.run_number }}|g" \
            k8s/backend/deployment.yaml
          grep image k8s/backend/deployment.yaml

      - name: Commit and push manifest
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add k8s/backend/deployment.yaml
          git commit -m "CI: update backend image to build ${{ github.run_number }}"
          git push
